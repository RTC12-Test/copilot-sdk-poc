name: CI Build

on:
  pull_request:
    branches: [main]
    paths:
      - "client_code/**"

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check all Python files
        run: |
          echo "=== Syntax check ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./__pycache__/*" | while read f; do
            echo "Checking $f ..."
            python -m py_compile "$f"
          done

          echo ""
          echo "=== Runtime check ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./__pycache__/*" | while read f; do
            echo "Running $f ..."
            python "$f" 2>&1 || true
          done
