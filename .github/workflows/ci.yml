name: CI Build

on:
  pull_request:
    branches: [main]
    paths:
      - "client_code/**"

jobs:
  python-check:
    if: >-
      !startsWith(github.head_ref, 'self-heal/') &&
      !startsWith(github.ref_name, 'self-heal/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check all Python files
        run: |
          echo "=== Syntax check ==="
          find client_code/ -name "*.py" | while read f; do
            echo "Checking $f ..."
            python -m py_compile "$f"
          done

          echo ""
          echo "=== Runtime check ==="
          find client_code/ -name "*.py" | while read f; do
            echo "Running $f ..."
            python "$f" 2>&1 || true
          done
