name: Self-Heal Build Failure

on:
  workflow_run:
    workflows: ["CI Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m copilot download-runtime

      - name: Configure gh auth
        run: echo "${{ secrets.COPILOT_OAUTH_TOKEN }}" | gh auth login --with-token

      - name: Run self-healer
        env:
          GITHUB_TOKEN: ${{ secrets.HEALER_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.COPILOT_OAUTH_TOKEN }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python src/healer.py
